name: release

on:
  push:
    tags: ["v*"]
  # Manual runs build and upload an artifact but never publish a release, so
  # the pipeline can be exercised without cutting a version.
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          # A universal build needs both slices present or cargo errors out.
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      # tauri.conf.json is the single source of truth for the version; a tag
      # that disagrees with it is a mistake worth failing on.
      - name: Resolve version
        id: version
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${GITHUB_REF_NAME#v}" != "$VERSION" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match tauri.conf.json version ${VERSION}"
            exit 1
          fi

      # An absent GitHub secret still reaches the job as a defined-but-empty
      # variable, and Tauri's bundler treats a *present* APPLE_CERTIFICATE as
      # "sign this" — so it tries to import an empty certificate and dies.
      # The signed path therefore has to be selected explicitly.
      - name: Detect signing credentials
        id: signing
        env:
          CERT: ${{ secrets.APPLE_CERTIFICATE }}
        run: |
          if [ -n "$CERT" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No Apple certificate configured — building unsigned."
          fi

      - name: Build universal app (signed)
        if: steps.signing.outputs.enabled == 'true'
        run: npx tauri build --target universal-apple-darwin
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Build universal app (unsigned)
        if: steps.signing.outputs.enabled != 'true'
        run: npx tauri build --target universal-apple-darwin

      - name: Package tarball for Homebrew
        id: package
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          BUNDLE=src-tauri/target/universal-apple-darwin/release/bundle/macos
          NAME="showmd-${VERSION}-universal.app.tar.gz"
          tar -C "$BUNDLE" -czf "$NAME" showmd.app
          SHA=$(shasum -a 256 "$NAME" | cut -d' ' -f1)
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          ARCHS=$(lipo -archs "$BUNDLE/showmd.app/Contents/MacOS/showmd")
          {
            echo "### Cask values for Ax6/homebrew-tap"
            echo '```ruby'
            echo "  version \"$VERSION\""
            echo "  sha256 \"$SHA\""
            echo '```'
            echo ""
            echo "| | |"
            echo "| --- | --- |"
            echo "| Architectures | \`$ARCHS\` |"
            echo "| App bundle | $(du -sh "$BUNDLE/showmd.app" | cut -f1) |"
            echo "| Tarball | $(du -h "$NAME" | cut -f1) |"
          } >> "$GITHUB_STEP_SUMMARY"
          # A universal build that silently lost a slice would break Intel users.
          case "$ARCHS" in
            *x86_64*arm64*|*arm64*x86_64*) ;;
            *) echo "::error::expected a universal binary, got: $ARCHS"; exit 1 ;;
          esac

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: showmd-universal
          path: ${{ steps.package.outputs.name }}
          if-no-files-found: error

      - name: Publish release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.package.outputs.name }}
          generate_release_notes: true
          body: |
            Install:

            ```bash
            brew install Ax6/tap/showmd
            ```

            Cask `sha256` for this build: `${{ steps.package.outputs.sha }}`

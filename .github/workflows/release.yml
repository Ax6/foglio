name: release

on:
  push:
    tags: ["v*"]
  # Manual runs build and upload an artifact but never publish a release, so
  # the pipeline can be exercised without cutting a version.
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          # A universal build needs both slices present or cargo errors out.
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      # tauri.conf.json is the single source of truth for the version; a tag
      # that disagrees with it is a mistake worth failing on.
      - name: Resolve version
        id: version
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${GITHUB_REF_NAME#v}" != "$VERSION" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match tauri.conf.json version ${VERSION}"
            exit 1
          fi

      # An absent GitHub secret still reaches the job as a defined-but-empty
      # variable, and Tauri's bundler treats a *present* APPLE_CERTIFICATE as
      # "sign this" — so it tries to import an empty certificate and dies.
      # The signed path therefore has to be selected explicitly.
      - name: Detect signing credentials
        id: signing
        env:
          CERT: ${{ secrets.APPLE_CERTIFICATE }}
          CERT_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          set -uo pipefail
          if [ -z "${CERT:-}" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No Apple certificate configured — building unsigned."
            exit 0
          fi

          # Validate before the build: codesign runs at the *end* of bundling,
          # so a bad secret otherwise wastes a full compile before failing.
          if ! printf '%s' "$CERT" | tr -d '\n\r' | base64 -d > cert.p12 2>/dev/null; then
            echo "::error::APPLE_CERTIFICATE is not valid base64. Re-set it with: base64 -i cert.p12 | tr -d '\\n' | gh secret set APPLE_CERTIFICATE --repo Ax6/showmd"
            exit 1
          fi

          # PKCS#12 is DER-encoded and always starts with an 0x3082 SEQUENCE.
          # Anything else means a .cer, a CSR, or a PEM was exported by mistake.
          MAGIC=$(head -c2 cert.p12 | xxd -p)
          if [ "$MAGIC" != "3082" ]; then
            echo "::error::APPLE_CERTIFICATE decodes to something that is not a PKCS#12 (.p12) file. Export the certificate from Keychain Access → My Certificates → Export as .p12 — not the .cer from the developer portal."
            rm -f cert.p12
            exit 1
          fi
          rm -f cert.p12

          if [ -z "${CERT_PASSWORD:-}" ]; then
            echo "::error::APPLE_CERTIFICATE_PASSWORD is not set. Re-export the .p12 with a password and store it in that secret."
            exit 1
          fi
          if [ -z "${IDENTITY:-}" ]; then
            echo "::error::APPLE_SIGNING_IDENTITY is not set. Use the exact string from: security find-identity -v -p codesigning"
            exit 1
          fi

          echo "enabled=true" >> "$GITHUB_OUTPUT"

      # Notarization fails with an opaque 403 when the team ID is wrong, and it
      # only fails *after* a full build. The certificate carries the real team ID
      # in its Organizational Unit, so it can be checked up front. Actions masks
      # secret values in logs, so a team ID that prints in the clear here is
      # by definition not the one stored in APPLE_TEAM_ID.
      - name: Cross-check team ID against the certificate
        if: steps.signing.outputs.enabled == 'true'
        env:
          CERT: ${{ secrets.APPLE_CERTIFICATE }}
          CERT_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -uo pipefail
          printf '%s' "$CERT" | tr -d '\n\r' | base64 -d > cert.p12
          SUBJECT=$(openssl pkcs12 -in cert.p12 -passin env:CERT_PASSWORD -nokeys -clcerts -legacy 2>/dev/null \
                    || openssl pkcs12 -in cert.p12 -passin env:CERT_PASSWORD -nokeys -clcerts 2>/dev/null \
                    | openssl x509 -noout -subject 2>/dev/null)
          rm -f cert.p12
          CERT_TEAM=$(printf '%s' "$SUBJECT" | tr ',/' '\n\n' | sed -n 's/.*OU *= *//p' | head -1 | tr -d ' ')
          if [ -z "$CERT_TEAM" ]; then
            echo "::warning::Could not read the team ID out of the certificate; skipping the cross-check."
            exit 0
          fi
          echo "Team ID according to the certificate: $CERT_TEAM"
          if [ "$CERT_TEAM" != "$(printf '%s' "$TEAM_ID" | tr -d '[:space:]')" ]; then
            echo "::error::APPLE_TEAM_ID does not match the certificate. The certificate says '$CERT_TEAM' (printed in the clear because it differs from the stored secret). Set it with: printf '%s' '$CERT_TEAM' | gh secret set APPLE_TEAM_ID --repo Ax6/showmd"
            exit 1
          fi
          echo "APPLE_TEAM_ID matches the certificate."

      - name: Build universal app (signed)
        if: steps.signing.outputs.enabled == 'true'
        run: npx tauri build --target universal-apple-darwin
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Build universal app (unsigned)
        if: steps.signing.outputs.enabled != 'true'
        run: npx tauri build --target universal-apple-darwin

      - name: Package tarball for Homebrew
        id: package
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          BUNDLE=src-tauri/target/universal-apple-darwin/release/bundle/macos
          NAME="foglio-${VERSION}-universal.app.tar.gz"
          tar -C "$BUNDLE" -czf "$NAME" "Foglio MD.app"
          SHA=$(shasum -a 256 "$NAME" | cut -d' ' -f1)
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          ARCHS=$(lipo -archs "$BUNDLE/Foglio MD.app/Contents/MacOS/foglio")
          {
            echo "### Cask values for Ax6/homebrew-tap"
            echo '```ruby'
            echo "  version \"$VERSION\""
            echo "  sha256 \"$SHA\""
            echo '```'
            echo ""
            echo "| | |"
            echo "| --- | --- |"
            echo "| Architectures | \`$ARCHS\` |"
            echo "| App bundle | $(du -sh "$BUNDLE/Foglio MD.app" | cut -f1) |"
            echo "| Tarball | $(du -h "$NAME" | cut -f1) |"
          } >> "$GITHUB_STEP_SUMMARY"
          # A universal build that silently lost a slice would break Intel users.
          case "$ARCHS" in
            *x86_64*arm64*|*arm64*x86_64*) ;;
            *) echo "::error::expected a universal binary, got: $ARCHS"; exit 1 ;;
          esac

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: foglio-universal
          path: ${{ steps.package.outputs.name }}
          if-no-files-found: error

      - name: Publish release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.package.outputs.name }}
          generate_release_notes: true
          body: |
            Install:

            ```bash
            brew install Ax6/tap/foglio
            ```

            Cask `sha256` for this build: `${{ steps.package.outputs.sha }}`
